version: "3.9"
services:
  bunny-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bunny-backend
    ports:
      - "8080:8080"
    environment:
      # Supabase PostgreSQL connection. The connection string is provided
      # by Supabase (Settings > Database > Connection string) and looks like
      #   postgres://postgres.<PROJECT_REF>:<DB_PASSWORD>@aws-0-<REGION>.supabase.co:5432/postgres
      # It is injected as SUPABASE_DATABASE_URL so the backend never
      # hardcodes the project reference or the password.
      DATABASE_URL: ${SUPABASE_DATABASE_URL}
      DATABASE_USER: ${SUPABASE_DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${SUPABASE_DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_ISSUER: ${JWT_ISSUER:-bunny}
      JWT_REALM: ${JWT_REALM:-bunny}
    restart: unless-stopped